<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Крипипаста — Silent Blade</title>
  <style>
    /* ===== ГЛОБАЛЬНЫЕ ===== */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #0a0a0a;
      font-family: "Courier New", monospace;
      color: #d0d0d0;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: url("img/photo_2026-06-06_03-57-39.jpg") no-repeat center center fixed;
      background-size: cover;
      filter: brightness(0.35);
      z-index: -2;
    }
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      z-index: -1;
    }

    /* ===== HEADER ===== */
    header {
      width: 100%;
      padding: 18px 20px;
      background: rgba(20, 20, 20, 0.92);
      border-bottom: 2px solid #550000;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px 20px;
      backdrop-filter: blur(4px);
    }
    header h1 {
      font-size: 26px;
      letter-spacing: 3px;
      margin: 0;
      white-space: nowrap;
    }
    .scary-word {
      color: #ff0000;
      text-shadow: 0 0 8px #ff0000;
    }
    .header-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 16px;
      flex: 1 1 auto;
      justify-content: flex-end;
    }
    .header-controls input,
    .header-controls select,
    .header-controls button {
      background: #1a1a1a;
      border: 1px solid #444;
      color: #ddd;
      padding: 7px 14px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 14px;
      transition: 0.3s;
    }
    .header-controls input:focus,
    .header-controls select:focus {
      border-color: #aa2222;
      outline: none;
    }
    .header-controls button {
      background: #2a2a2a;
      cursor: pointer;
      border-color: #555;
    }
    .header-controls button:hover {
      background: #3a3a3a;
      border-color: #aa2222;
    }
    .header-controls .btn-add {
      background: #550000;
      border-color: #aa2222;
      font-weight: bold;
    }
    .header-controls .btn-add:hover {
      background: #aa2222;
      box-shadow: 0 0 20px rgba(255,0,0,0.3);
    }
    .filter-btn.active {
      background: #550000;
      border-color: #ff0000;
      box-shadow: 0 0 10px rgba(255,0,0,0.2);
    }
    .admin-badge {
      background: #550000;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      letter-spacing: 1px;
      border: 1px solid #ff0000;
      color: #ff9999;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .admin-badge::before {
      content: "⚙️";
    }

    /* ===== ОСНОВНОЙ КОНТЕЙНЕР ===== */
    .main-content {
      max-width: 1300px;
      margin: 0 auto;
      padding: 40px 20px 60px;
    }

    /* ===== ЗАГОЛОВКИ РАЗДЕЛОВ ===== */
    .section-title {
      font-size: 28px;
      text-transform: uppercase;
      letter-spacing: 5px;
      border-bottom: 1px solid rgba(175,175,175,0.2);
      padding-bottom: 8px;
      margin: 30px 0 20px;
      width: 100%;
    }
    .section-title.traitors-title {
      color: #ff3333;
      border-color: #ff3333;
    }

    /* ===== КОНТЕЙНЕР КАРТОЧЕК ===== */
    .cards-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 25px;
      width: 100%;
      transition: all 0.3s;
    }
    .cards-grid.list-view {
      flex-direction: column;
      align-items: stretch;
    }
    .cards-grid.list-view .card-wrapper {
      flex: 1 1 100%;
      max-width: 100%;
    }
    .cards-grid.grid-view {
      flex-direction: row;
      justify-content: flex-start;
    }
    .cards-grid.grid-view .card-wrapper {
      flex: 1 1 calc(33.333% - 25px);
      min-width: 280px;
      max-width: 100%;
    }

    /* ===== ОБЁРТКА КАРТОЧКИ ===== */
    .card-wrapper {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.6s ease, transform 0.6s ease;
      perspective: 800px;
      cursor: pointer;
    }
    .card-wrapper.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ===== КАРТОЧКА-ФЛИП ===== */
    .card-flip {
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform 0.6s cubic-bezier(0.23, 1, 0.32, 1);
      transform-style: preserve-3d;
      border-radius: 12px;
      min-height: 320px;
    }
    .card-wrapper.flipped .card-flip {
      transform: rotateY(180deg);
    }
    .card-front,
    .card-back {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 12px;
      background: rgba(15, 15, 15, 0.92);
      border: 1px solid rgba(255,0,0,0.15);
      padding: 22px 24px;
      box-shadow: 0 0 30px rgba(0,0,0,0.7);
      display: flex;
      flex-direction: column;
      overflow: auto;
    }
    .card-back {
      transform: rotateY(180deg);
      background: rgba(10, 10, 10, 0.96);
      border-color: #550000;
    }

    /* Стили для предателей */
    .card-wrapper.traitor .card-front,
    .card-wrapper.traitor .card-back {
      filter: grayscale(1) brightness(0.7);
      border-color: #444;
      transition: filter 0.5s;
    }
    .card-wrapper.traitor:hover .card-front,
    .card-wrapper.traitor:hover .card-back {
      filter: grayscale(0) brightness(1);
      border-color: #ff0000;
      box-shadow: 0 0 30px rgba(255,0,0,0.3);
    }
    .card-wrapper.traitor .card-front::before {
      content: "ПРЕДАТЕЛЬ";
      position: absolute;
      top: 12px;
      right: -30px;
      background: #ff0000;
      color: #000;
      font-weight: bold;
      padding: 4px 40px;
      transform: rotate(35deg);
      font-size: 13px;
      z-index: 5;
      letter-spacing: 2px;
    }
    .card-wrapper.traitor.flipped .card-front::before {
      transform: rotate(35deg) scaleX(-1);
    }
    .card-wrapper.traitor .card-front h2 {
      color: #ff7f7f;
    }

    .card-front h2 {
      color: #ff7f7f;
      margin: 0 0 10px;
      font-size: 22px;
      letter-spacing: 1px;
    }
    .card-front .details {
      list-style: none;
      padding: 0;
      margin: 6px 0;
      flex: 1;
    }
    .card-front .details li {
      padding: 3px 0;
      border-bottom: 1px dotted #2a2a2a;
      font-size: 14px;
    }
    .card-front .details strong {
      color: #bbb;
      display: inline-block;
      min-width: 110px;
    }

    .card-back .story {
      white-space: pre-wrap;
      line-height: 1.6;
      font-size: 14px;
      flex: 1;
      overflow-y: auto;
    }
    .card-back .story p {
      margin: 8px 0;
    }
    .card-back .reason-box {
      margin-top: 12px;
      padding: 10px 14px;
      background: rgba(255,0,0,0.12);
      border-left: 4px solid #ff0000;
      font-style: italic;
      color: #ffcccc;
      border-radius: 0 6px 6px 0;
      font-size: 14px;
    }

    .card-actions {
      margin-top: 16px;
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      border-top: 1px solid #2a2a2a;
      padding-top: 14px;
      flex-shrink: 0;
    }
    .card-actions button {
      background: transparent;
      border: 1px solid #666;
      color: #ccc;
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      transition: 0.2s;
    }
    .card-actions button:hover {
      background: #2a2a2a;
      border-color: #aaa;
    }
    .card-actions .btn-edit:hover {
      border-color: #ffaa00;
      color: #ffaa00;
    }
    .card-actions .btn-delete:hover {
      border-color: #ff3333;
      color: #ff3333;
    }

    .flip-hint {
      position: absolute;
      bottom: 10px;
      right: 14px;
      font-size: 12px;
      color: #555;
      letter-spacing: 1px;
      opacity: 0.6;
      pointer-events: none;
    }

    /* ===== АНИМАЦИЯ ДЛЯ ПРЕДАТЕЛЕЙ ===== */
    .card-wrapper.traitor:hover .card-front h2 {
      animation: glitch 0.3s infinite;
      text-shadow: 2px 0 red, -2px 0 blue;
    }
    @keyframes glitch {
      0% { transform: translate(0); }
      20% { transform: translate(-2px, 2px); }
      40% { transform: translate(-2px, -2px); }
      60% { transform: translate(2px, 2px); }
      80% { transform: translate(2px, -2px); }
      100% { transform: translate(0); }
    }

    /* ===== МОДАЛЬНОЕ ОКНО ===== */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: #1a1a1a;
      max-width: 700px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      border: 1px solid #550000;
      border-radius: 16px;
      padding: 30px 35px;
      box-shadow: 0 0 60px rgba(255,0,0,0.2);
      position: relative;
    }
    .modal h2 {
      color: #ff7f7f;
      text-align: center;
      margin-bottom: 20px;
      font-size: 26px;
      letter-spacing: 2px;
    }
    .modal .close-btn {
      position: absolute;
      top: 12px;
      right: 20px;
      background: none;
      border: none;
      color: #aaa;
      font-size: 30px;
      cursor: pointer;
      transition: 0.2s;
    }
    .modal .close-btn:hover {
      color: #ff3333;
      transform: scale(1.1);
    }
    .modal form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .modal label {
      font-weight: bold;
      color: #bbbbbb;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .modal input, .modal textarea, .modal select {
      background: #0d0d0d;
      border: 1px solid #333;
      color: #ddd;
      padding: 10px 14px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 15px;
      width: 100%;
    }
    .modal textarea { min-height: 100px; resize: vertical; }
    .modal .checkbox-row {
      flex-direction: row;
      align-items: center;
      gap: 12px;
    }
    .modal .checkbox-row input[type="checkbox"] {
      width: auto;
      transform: scale(1.2);
      margin-right: 8px;
    }
    .modal .form-actions {
      display: flex;
      gap: 15px;
      justify-content: flex-end;
      margin-top: 10px;
    }
    .modal .form-actions button {
      padding: 10px 28px;
      border: none;
      border-radius: 6px;
      font-family: inherit;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }
    .modal .form-actions .btn-save {
      background: #550000;
      color: #fff;
    }
    .modal .form-actions .btn-save:hover { background: #aa2222; }
    .modal .form-actions .btn-cancel {
      background: #333;
      color: #ccc;
    }
    .modal .form-actions .btn-cancel:hover { background: #555; }

    /* ===== ЭКСПОРТ ===== */
    header { position: relative; z-index: 100; }
    .export-wrap { position: relative; display: none; }
    .export-menu {
      display: none;
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      min-width: 230px;
      background: #1a1a1a;
      border: 1px solid #550000;
      border-radius: 8px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.7);
      z-index: 500;
      overflow: hidden;
    }
    .export-wrap.open .export-menu { display: block; }
    .header-controls .export-menu button {
      display: block;
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      border-bottom: 1px solid #2a2a2a;
      border-radius: 0;
      padding: 10px 14px;
    }
    .header-controls .export-menu button:last-child { border-bottom: none; }
    .header-controls .export-menu button:hover { background: #3a3a3a; }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      background: #1a1a1a;
      border: 1px solid #aa2222;
      color: #ddd;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 2000;
      box-shadow: 0 0 20px rgba(255,0,0,0.25);
    }

    /* ===== FOOTER ===== */
    footer {
      text-align: center;
      padding: 25px 20px;
      background: rgba(10,10,10,0.9);
      border-top: 1px solid #2a2a2a;
      font-size: 14px;
      color: #666;
      letter-spacing: 1px;
    }

    /* ===== АДАПТИВ ===== */
    @media (max-width: 900px) {
      .cards-grid.grid-view .card-wrapper {
        flex: 1 1 calc(50% - 25px);
        min-width: 240px;
      }
    }
    @media (max-width: 600px) {
      header { flex-direction: column; align-items: stretch; }
      header h1 { font-size: 22px; text-align: center; }
      .header-controls { justify-content: center; }
      .cards-grid.grid-view .card-wrapper {
        flex: 1 1 100%;
        min-width: 0;
      }
      .card-front .details strong { min-width: 80px; }
      .modal { padding: 20px 16px; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Добро пожаловать в <span class="scary-word">Крипипасту</span></h1>
    <div class="header-controls">
      <button class="btn-add" id="openAddBtn" style="display:none;">➕ Добавить</button>
      <div>
        <button class="filter-btn active" data-filter="all">Все</button>
        <button class="filter-btn" data-filter="active">Активные</button>
        <button class="filter-btn" data-filter="traitors">Предатели</button>
      </div>
      <input type="text" id="searchInput" placeholder="🔍 Поиск по имени..." style="min-width:160px;">
      <div style="display:flex; gap:6px;">
        <button id="viewList" class="view-btn active" title="Список">☰</button>
        <button id="viewGrid" class="view-btn" title="Сетка">▦</button>
      </div>
      <div class="export-wrap" id="exportWrap">
        <button id="exportBtn" aria-haspopup="true" aria-expanded="false">📤 Экспорт ▾</button>
        <div class="export-menu" id="exportMenu" role="menu">
          <button data-export="json" role="menuitem">JSON (.json)</button>
          <button data-export="md" role="menuitem">Markdown (.md)</button>
          <button data-export="copy" role="menuitem">Скопировать список</button>
          <button data-export="import" role="menuitem">Импорт из JSON…</button>
        </div>
        <input type="file" id="importFile" accept=".json,application/json" style="display:none;">
      </div>
      <button id="adminLoginBtn" class="admin-login-btn" style="border-color:#aa2222;color:#ff9999;">🔑 Вход для админа</button>
      <button id="adminLogoutBtn" style="display:none;border-color:#550000;color:#ff6666;">🚪 Выйти</button>
      <span id="adminBadge" class="admin-badge" style="display:none;">Администратор</span>
    </div>
  </header>

  <div class="main-content" id="app"></div>

  <footer>© 2026 Silent Blade · Крипипаста · Все тени принадлежат нам</footer>

  <!-- ===== МОДАЛЬНОЕ ОКНО ===== -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <button class="close-btn" id="modalCloseBtn">&times;</button>
      <h2 id="modalTitle">Добавить участника</h2>
      <form id="memberForm">
        <input type="hidden" id="editId" value="">
        <label>Имя * <input type="text" id="fName" required></label>
        <label>Место проживания <input type="text" id="fPlace"></label>
        <label>Дата рождения <input type="text" id="fBirth" placeholder="дд месяц гггг"></label>
        <label>Содержание (роль) <input type="text" id="fContent" placeholder="Наблюдетель, псих, ..."></label>
        <label>Принят(а) <input type="text" id="fAccepted" placeholder="дд месяц гггг"></label>
        <label>Telegram <input type="text" id="fTelegram" placeholder="@username"></label>
        <label>Номер телефона <input type="text" id="fPhone" placeholder="+7 ..."></label>
        <label>История * <textarea id="fStory" required placeholder="Расскажите историю..."></textarea></label>
        <label class="checkbox-row">
          <input type="checkbox" id="fIsTraitor"> Это предатель
        </label>
        <label id="traitorReasonLabel">Причина изгнания <textarea id="fTraitorReason" placeholder="Укажите причину..."></textarea></label>
        <div class="form-actions">
          <button type="button" class="btn-cancel" id="modalCancelBtn">Отмена</button>
          <button type="submit" class="btn-save">Сохранить</button>
        </div>
      </form>
    </div>
  </div>

  <script>

      const form = document.getElementById('memberForm');
      const editId = document.getElementById('editId');
      const fName = document.getElementById('fName');
      const fPlace = document.getElementById('fPlace');
      const fBirth = document.getElementById('fBirth');
      const fContent = document.getElementById('fContent');
      const fAccepted = document.getElementById('fAccepted');
      const fTelegram = document.getElementById('fTelegram');
      const fPhone = document.getElementById('fPhone');
      const fStory = document.getElementById('fStory');
      const fIsTraitor = document.getElementById('fIsTraitor');
      const fTraitorReason = document.getElementById('fTraitorReason');
      const traitorReasonLabel = document.getElementById('traitorReasonLabel');

      fIsTraitor.addEventListener('change', function() {
        traitorReasonLabel.style.display = this.checked ? 'flex' : 'none';
      });

      function openModal(member = null) {
        if (!isAdmin) {
          alert('Доступно только администратору.');
          return;
        }
        if (member) {
          modalTitle.textContent = 'Редактировать участника';
          editId.value = member.id;
          fName.value = member.name || '';
          fPlace.value = member.place || '';
          fBirth.value = member.birthDate || '';
          fContent.value = member.content || '';
          fAccepted.value = member.accepted || '';
          fTelegram.value = member.telegram || '';
          fPhone.value = member.phone || '';
          fStory.value = member.story || '';
          fIsTraitor.checked = member.isTraitor || false;
          fTraitorReason.value = member.traitorReason || '';
        } else {
          modalTitle.textContent = 'Добавить участника';
          editId.value = '';
          form.reset();
          fIsTraitor.checked = false;
          fTraitorReason.value = '';
        }
        traitorReasonLabel.style.display = fIsTraitor.checked ? 'flex' : 'none';
        modalOverlay.classList.add('active');
      }

      function closeModal() {
        modalOverlay.classList.remove('active');
      }

      modalCloseBtn.addEventListener('click', closeModal);
      modalCancelBtn.addEventListener('click', closeModal);
      modalOverlay.addEventListener('click', function(e) {
        if (e.target === modalOverlay) closeModal();
      });

      form.addEventListener('submit', function(e) {
        e.preventDefault();
        if (!isAdmin) {
          alert('Доступно только администратору.');
          return;
        }
        const name = fName.value.trim();
        const story = fStory.value.trim();
        if (!name || !story) {
          alert('Имя и история обязательны для заполнения!');
          return;
        }
        const isTraitor = fIsTraitor.checked;
        const traitorReason = isTraitor ? fTraitorReason.value.trim() : '';
        const memberData = {
          name: name,
          place: fPlace.value.trim(),
          birthDate: fBirth.value.trim(),
          content: fContent.value.trim(),
          accepted: fAccepted.value.trim(),
          telegram: fTelegram.value.trim(),
          phone: fPhone.value.trim(),
          story: story,
          isTraitor: isTraitor,
          traitorReason: traitorReason
        };
        const id = editId.value;
        if (id) {
          const index = members.findIndex(m => m.id === id);
          if (index !== -1) members[index] = { ...members[index], ...memberData };
        } else {
          memberData.id = Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
          members.push(memberData);
        }
        saveData(members);
        renderCards();
        closeModal();
      });

      document.getElementById('openAddBtn').addEventListener('click', function() {
        if (!isAdmin) {
          alert('Доступно только администратору.');
          return;
        }
        openModal(null);
      });

      // ============================================================
      // 10. УПРАВЛЕНИЕ ФИЛЬТРАМИ, ПОИСКОМ, ВИДОМ
      // ============================================================
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          currentFilter = this.dataset.filter;
          renderCards();
        });
      });

      document.getElementById('searchInput').addEventListener('input', function() {
        searchQuery = this.value;
        renderCards();
      });

      document.getElementById('viewList').addEventListener('click', function() {
        viewMode = 'list';
        document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        renderCards();
      });
      document.getElementById('viewGrid').addEventListener('click', function() {
        viewMode = 'grid';
        document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        renderCards();
      });

      // ============================================================
      // 10a. ЭКСПОРТ (только для админа)
      // ============================================================
      const exportWrap = document.getElementById('exportWrap');
      const exportBtn = document.getElementById('exportBtn');

      function setExportMenu(open) {
        exportWrap.classList.toggle('open', open);
        exportBtn.setAttribute('aria-expanded', String(open));
      }

      function showToast(text) {
        const t = document.createElement('div');
        t.className = 'toast';
        t.textContent = text;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 2800);
      }

      function exportDate() {
        return new Date().toISOString().slice(0, 10);
      }

      function downloadFile(filename, text, mime) {
        const blob = new Blob([text], { type: mime + ';charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }

      function mdEscape(text) {
        return String(text).replace(/([\\\[\]])/g, '\\$1');
      }

      // Ссылка на участника: Telegram-ник или готовый URL; иначе пусто
      function memberUrl(m) {
        const tg = (m.telegram || '').trim();
        if (/^https?:\/\//i.test(tg)) return tg;
        const nick = tg.replace(/^@/, '');
        return /^[A-Za-z0-9_]{3,}$/.test(nick) ? 'https://t.me/' + nick : '';
      }

      function buildMarkdown() {
        const line = m => {
          const name = mdEscape(m.name || 'Без имени');
          const url = memberUrl(m);
          return url ? `- [${name}](${url})` : `- ${name}`;
        };
        const groups = [
          { title: 'Состав', list: members.filter(m => !m.isTraitor) },
          { title: 'Архив Предателей', list: members.filter(m => m.isTraitor) }
        ];
        let md = '# Крипипаста — Silent Blade\n';
        groups.forEach(g => {
          if (g.list.length === 0) return;
          md += `\n## ${g.title}\n\n` + g.list.map(line).join('\n') + '\n';
        });
        return md;
      }

      async function copyMarkdown() {
        const md = buildMarkdown();
        try {
          if (!navigator.clipboard || !window.isSecureContext) throw new Error('clipboard unavailable');
          await navigator.clipboard.writeText(md);
          showToast('Список скопирован');
        } catch (err) {
          downloadFile('creepypasta-' + exportDate() + '.md', md, 'text/markdown');
          showToast('Буфер недоступен — список скачан файлом .md');
        }
      }

      exportBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        setExportMenu(!exportWrap.classList.contains('open'));
      });
      document.addEventListener('click', function(e) {
        if (!exportWrap.contains(e.target)) setExportMenu(false);
      });
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') setExportMenu(false);
      });
      document.getElementById('exportMenu').addEventListener('click', function(e) {
        const item = e.target.closest('button[data-export]');
        if (!item) return;
        setExportMenu(false);
        if (!isAdmin) {
          alert('Доступно только администратору.');
          return;
        }
        const kind = item.dataset.export;
        if (kind === 'json') {
          downloadFile('creepypasta-' + exportDate() + '.json', JSON.stringify(members, null, 2), 'application/json');
        } else if (kind === 'md') {
          downloadFile('creepypasta-' + exportDate() + '.md', buildMarkdown(), 'text/markdown');
        } else if (kind === 'copy') {
          copyMarkdown();
        } else if (kind === 'import') {
          document.getElementById('importFile').click();
        }
      });

      // ----- ИМПОРТ из JSON (слияние по id) -----
      const IMPORT_FIELDS = ['name', 'place', 'birthDate', 'content', 'accepted', 'telegram', 'phone', 'story', 'traitorReason'];

      function normalizeMember(raw) {
        if (!raw || typeof raw !== 'object') return null;
        const name = typeof raw.name === 'string' ? raw.name.trim() : '';
        if (!name) return null;
        const m = {};
        IMPORT_FIELDS.forEach(f => { m[f] = typeof raw[f] === 'string' ? raw[f] : ''; });
        m.name = name;
        m.isTraitor = raw.isTraitor === true;
        if (!m.isTraitor) m.traitorReason = '';
        const hasId = (typeof raw.id === 'string' || typeof raw.id === 'number') && String(raw.id) !== '';
        m.id = hasId ? String(raw.id) : Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
        return m;
      }

      document.getElementById('importFile').addEventListener('change', function() {
        const file = this.files[0];
        this.value = '';
        if (!file) return;
        if (!isAdmin) {
          alert('Доступно только администратору.');
          return;
        }
        const reader = new FileReader();
        reader.onerror = () => alert('Не удалось прочитать файл.');
        reader.onload = () => {
          let data;
          try { data = JSON.parse(reader.result); }
          catch (e) { alert('Это не JSON-файл или он повреждён.'); return; }
          if (!Array.isArray(data)) {
            alert('Ожидается JSON-массив участников — такой, какой делает «Экспорт → JSON».');
            return;
          }
          const items = data.map(normalizeMember).filter(Boolean);
          if (items.length === 0) {
            alert('В файле не найдено ни одного участника с именем.');
            return;
          }
          const known = new Set(members.map(m => m.id));
          const updated = items.filter(m => known.has(m.id)).length;
          const added = items.length - updated;
          const skipped = data.length - items.length;
          const msg = `Импорт: добавить ${added}, обновить ${updated}` +
            (skipped ? `, пропустить ${skipped} (без имени)` : '') +
            `.\nУчастники, которых нет в файле, останутся как есть. Продолжить?`;
          if (!confirm(msg)) return;
          items.forEach(m => {
            const i = members.findIndex(x => x.id === m.id);
            if (i !== -1) members[i] = m; else members.push(m);
          });
          saveData(members);
          renderCards();
          showToast(`Импортировано: +${added}, обновлено ${updated}`);
        };
        reader.readAsText(file);
      });

      // ============================================================
      // 11. ПЕРВОНАЧАЛЬНЫЙ РЕНДЕРИНГ И ОБНОВЛЕНИЕ UI
      // ============================================================
      updateAdminUI();
      renderCards();

    })();
  </script>
</body>
</html>
